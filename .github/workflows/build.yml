name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Capacitor project
        run: |
          mkdir -p app/www/lib
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 xlsx@0.18.5 jspdf@2.5.1 html2canvas@1.4.1
          cp ../index.html www/index.html
          cp node_modules/xlsx/dist/xlsx.full.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          npx cap init "ویزیت دوو" com.daewoo.visit --web-dir www
          npx cap add android
          npm i sharp
          cat > icons.js <<'EOF'
          const fs=require('fs');
          const sharp=require('sharp');
          const h=fs.readFileSync('../index.html','utf8');
          const g=id=>{const m=h.match(new RegExp('id="'+id+'">([^<]*)<'));return m&&m[1].trim()?Buffer.from(m[1].trim(),'base64'):null};
          const a=g('app-icon'),b=g('app-icon-fg');
          if(!a||!b){console.log('no icons in index.html');process.exit(0)}
          const res='android/app/src/main/res/';
          const D={mdpi:[48,108],hdpi:[72,162],xhdpi:[96,216],xxhdpi:[144,324],xxxhdpi:[192,432]};
          (async()=>{
            for(const k of Object.keys(D)){
              const dir=res+'mipmap-'+k+'/';
              fs.mkdirSync(dir,{recursive:true});
              await sharp(a).resize(D[k][0],D[k][0]).png().toFile(dir+'ic_launcher.png');
              await sharp(a).resize(D[k][0],D[k][0]).png().toFile(dir+'ic_launcher_round.png');
              await sharp(b).resize(D[k][1],D[k][1]).png().toFile(dir+'ic_launcher_foreground.png');
            }
            fs.mkdirSync(res+'values',{recursive:true});
            fs.writeFileSync(res+'values/ic_launcher_background.xml','<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E5BD8</color>\n</resources>\n');
            const x='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n';
            fs.mkdirSync(res+'mipmap-anydpi-v26',{recursive:true});
            fs.writeFileSync(res+'mipmap-anydpi-v26/ic_launcher.xml',x);
            fs.writeFileSync(res+'mipmap-anydpi-v26/ic_launcher_round.xml',x);
            console.log('icons done');
          })().catch(e=>{console.error('icon step failed',e.message)});
          EOF
          node icons.js
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daewoo-visit-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Visit App v${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
