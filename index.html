<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#14213d;--mu:#6b778c;--bd:#e1e7f0;--ac:#1e5bd8;--acx:#fff;--ok:#1a7f45;--er:#c0392b;--sh:0 2px 10px rgba(15,42,92,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1320;--card:#182033;--tx:#e8edf7;--mu:#93a0b8;--bd:#27314a;--ac:#5b92ff;--acx:#0a1020;--ok:#4cc27f;--er:#ff7a6b;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
.hero{background:linear-gradient(135deg,#0f2a5c,#1e5bd8);color:#fff;padding:20px 16px 26px;display:flex;gap:12px;align-items:center;border-radius:0 0 26px 26px;margin-bottom:12px}

.hero h1{margin:0;font-size:20px;font-weight:800}.hero div div{opacity:.8;font-size:12px}
#app{padding:0 12px 96px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(15,42,92,.1)}
nav button{flex:1 0 auto;min-width:76px;white-space:nowrap;border:0;border-top:3px solid transparent;background:none;color:var(--tx);padding:8px 8px 7px;font:inherit;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}nav button i{font-style:normal;font-size:22px;line-height:1}nav button.on{color:var(--ac);background:rgba(30,91,216,.12);border-top-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-size:17px;font-weight:800;margin:4px 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--ac)}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button.b{font:inherit;font-weight:700;padding:11px 16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}button.p{background:linear-gradient(135deg,#1e5bd8,#0f2a5c);color:#fff;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.mu{color:var(--mu);font-size:12px}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1.5px solid var(--bd);font-size:12px;margin:2px}
.ok{color:var(--ok)}.er{color:var(--er)}.li{padding:9px 0;border-top:1px solid var(--bd)}.li:first-child{border:0}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}td,th{border:1px solid var(--bd);padding:4px}th{background:var(--bg)}
.w{overflow-x:auto}.ch label{display:inline-block;padding:4px 14px;border:1.5px solid var(--bd);border-radius:99px;margin:3px;font-size:13px;color:var(--tx);background:var(--card)}.ch label:has(input:checked){background:var(--ac);color:var(--acx);border-color:var(--ac)}.ch input{display:none}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px}
body.pfm .hero,body.pfm #app{display:none}#pff{position:fixed;left:0;right:0;top:0;width:100%;border:0;background:var(--bg);display:none}
</style>

<div class="hero"><div class="wm">DAEWOO</div><div><h1>ویزیت کارشناسان</h1><div id="hs"></div></div></div>
<div id="app"></div>
<nav id="nav"></nav>
<script>
(function(){if(!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))return;
function b64(buf){var b='',u=new Uint8Array(buf),i=0;for(;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b)}
function toBuf(d){if(d instanceof Blob)return d.arrayBuffer();if(typeof d==='string')return Promise.resolve(new TextEncoder().encode(d).buffer);if(ArrayBuffer.isView(d))return Promise.resolve(d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength));return Promise.resolve(d)}
window.claude={use:function(n){if(n!=='downloads')return Promise.resolve(null);return Promise.resolve({save:function(o){var m=/\.[A-Za-z0-9]+$/.exec(o.filename),nm='report_'+Date.now()+(m?m[0]:'');return toBuf(o.data).then(function(buf){var P=Capacitor.Plugins;return P.Filesystem.writeFile({path:nm,data:b64(buf),directory:'CACHE'}).then(function(r){return P.Share.share({title:nm,url:r.uri,dialogTitle:'ذخیره یا ارسال فایل'})})})}})}}})();
</script>
<script src="lib/xlsx.full.min.js"></script>
<script>
function toast(m){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;background:#14213d;color:#fff;padding:12px 14px;border-radius:12px;z-index:9999;text-align:center;font-size:14px';document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}
window.alert=toast;
var D=null,V=[],S=[],E='',BK='',tab='visit',cur=null,P=[],GPS='',mem={};
var DB=new Promise(function(r){try{var q=indexedDB.open('visitapp',1);q.onupgradeneeded=function(){q.result.createObjectStore('k')};q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}});
function gt(k){return DB.then(function(d){return new Promise(function(r){if(!d)return r(mem[k]);try{var q=d.transaction('k').objectStore('k').get(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(undefined)}}catch(e){r(undefined)}})})}
function st(k,v){mem[k]=v;return DB.then(function(d){return new Promise(function(r){if(!d)return r();try{var t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}})})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nm(s){return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ئ/g,'ی').replace(/\s+/g,' ').trim()}
function mi(n){return n?Math.round(n/1e6).toLocaleString('fa-IR'):'۰'}
function fa(n){return Number(n||0).toLocaleString('fa-IR')}
function pd(n){return n<10?'0'+n:''+n}
function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334],jy=gm>2?gy+1:gy,d=355666+365*gy+~~((jy+3)/4)-~~((jy+99)/100)+~~((jy+399)/400)+gd+g[gm-1];jy=-1595+33*~~(d/12053);d%=12053;jy+=4*~~(d/1461);d%=1461;if(d>365){jy+=~~((d-1)/365);d=(d-1)%365}var jm=d<186?1+~~(d/31):7+~~((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return jy+'/'+pd(jm)+'/'+pd(jd)}
function today(){var t=new Date();return g2j(t.getFullYear(),t.getMonth()+1,t.getDate())}
function hm(){var t=new Date();return pd(t.getHours())+':'+pd(t.getMinutes())}
var CATS=['BMF','TMF','SD','SBS','TV','جاروبرقی','لباسشویی','ظرفشویی'];
var FB=['کیفیت محصول','خرابی/مرجوعی','خدمات پس از فروش','قیمت','تسویه/چک','حمل و تحویل','تبلیغات/پوستر','نمونه/تخفیف'];
var TYPES=['مذاکره فروش','پیگیری اعتباری','پیگیری چک','ویترینی/نصب','بازدید اضافه','پیگیری'];
function rows(wb,n){var ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}):[]}
function parse(buf){
 var wb=XLSX.read(buf,{type:'array',cellFormula:false,cellStyles:false,sheets:['DAEWOO(RLS)','DAEWOO(QTY)','3Month BUY','3Month Installation','Aban Sales','CONTRACTS','VISITPLAN1','CHEQUE','Realization']});
 var rl=rows(wb,'DAEWOO(RLS)');if(!rl.length)throw new Error('شیت DAEWOO(RLS) پیدا نشد');
 var ex={},all=[];
 for(var i=5;i<rl.length;i++){var r=rl[i];if(!r[0]||!r[4])continue;var e=nm(r[4]);ex[e]=1;all.push({e:e,c:{code:String(r[0]),guar:r[5],dev:r[18],name:r[1],type:r[2],city:r[3],grade:r[6],visits:r[7],chq:r[8],chqPaid:r[9],aS:r[10],aD:r[11],aB:r[12],plan:r[14],buy:r[16],real:r[17],cat:{},orders:[],inst:[],aban:[]}})}
 return{wb:wb,ex:Object.keys(ex).sort(),all:all,m:[String((rl[0]||[])[9]||''),String((rl[1]||[])[9]||'')]}}
function build(p,expert){
 var wb=p.wb,C={};p.all.forEach(function(x){if(x.e===expert)C[x.c.code]=x.c});
 rows(wb,'DAEWOO(QTY)').forEach(function(r,i){if(i<5)return;var c=C[String(r[0])];if(c){c.credit=r[8];c.stock=r.slice(27,35);c.cat={buy:r.slice(9,17),inst:r.slice(18,26),plan:r.slice(36,44),sale:r.slice(45,53)}}});
 rows(wb,'3Month BUY').forEach(function(r,i){if(!i)return;var c=C[String(r[5])];if(c)c.orders.push([r[2],r[8],r[9],r[15],r[19]])});
 rows(wb,'Aban Sales').forEach(function(r,i){if(!i)return;var c=C[String(r[5])];if(c)c.aban.push([r[2],r[8],r[9],r[15],r[12],r[13]])});
 rows(wb,'3Month Installation').forEach(function(r,i){if(!i)return;var c=C[String(r[14])];if(c)c.inst.push([r[11],r[3],r[13],r[2]])});
 rows(wb,'CONTRACTS').forEach(function(r,i){if(i<2)return;var c=C[String(r[0])];if(c&&!c.mobile){c.owner=r[5];c.mobile=r[7];c.store=r[8];c.kind=r[4]}});
 var vp=rows(wb,'VISITPLAN1'),dates=(vp[1]||[]).slice(5,35),plan=[];
 vp.forEach(function(r,i){if(i<2||nm(r[2])!==expert)return;dates.forEach(function(d,k){if(r[5+k]==1)plan.push([String(d).trim(),String(r[0])])})});
 plan.sort();
 var chq=[];rows(wb,'CHEQUE').forEach(function(r,i){if(i<2)return;var cd=String(r[0]);if(C[cd])chq.push([cd,String(r[2]).trim(),Number(r[3])||0,String(r[4]),r[5],r[12],r[8]])});
 chq.sort(function(a,b){return a[1]<b[1]?-1:a[1]>b[1]?1:0});
 var rl={};rows(wb,'Realization').forEach(function(r,i){if(i>=3&&nm(r[1])===expert)rl={planPct:r[2],planR:r[3],sale:r[7],real:r[8],devPlan:r[10],devReal:r[11],devPct:r[12]}});
 return{expert:expert,ts:today(),cust:C,plan:plan,chq:chq,rl:rl,m1:p.m[0],m2:p.m[1]}}
var PEND=null;
function loadFile(f){
 if(!f)return;msg('در حال خواندن فایل…');
 var fr=new FileReader();fr.onload=function(){setTimeout(function(){try{
  var p=parse(fr.result);
  if(E&&p.ex.indexOf(E)>-1){finish(p,E)}else{PEND=p;pick(p.ex)}
 }catch(e){msg('خطا در خواندن فایل: '+esc(e.message))}},30)};fr.readAsArrayBuffer(f)}
function finish(p,e){E=e;st('E',E);D=build(p,e);PEND=null;st('D',D);tab='cust';draw()}
function pick(ex){$('app').innerHTML='<div class="c"><h2>نام کارشناس را انتخاب کنید</h2><select id="ex">'+ex.map(function(e){return'<option>'+esc(e)+'</option>'}).join('')+'</select><button class="b p" onclick="finish(PEND,$(\'ex\').value)">تأیید</button></div>'}
function msg(t){$('app').innerHTML='<div class="c">'+t+'</div>'}
function $(i){return document.getElementById(i)}
function imp(){return'<div class="c"><h2>بارگذاری فایل اکسل</h2><p class="mu">همان فایل کامل (مثل 08_Aban_RdMap) را انتخاب کنید. فقط اطلاعات کارشناس شما نگه داشته می‌شود. هر هفته می‌توانید فایل جدید را دوباره بارگذاری کنید؛ ویزیت‌ها و فروشگاه‌های ثبت‌شده پاک نمی‌شوند.</p><input type="file" onchange="loadFile(this.files[0])"></div>'}
function nav(){var T=[['visit','📝','ثبت ویزیت'],['cust','🏪','فروشگاه‌ها'],['hist','📊','گزارش مشتری'],['chq','🧾','راس‌گیری چک'],['perf','🎯','عملکرد من'],['plan','📅','برنامه'],['pf','💲','پیش‌فاکتور'],['rep','📈','گزارش‌ها'],['imp','📥','اکسل']];$('nav').innerHTML=T.map(function(t){var on=tab===t[0]||(tab==='det'&&t[0]===(BK||'cust'))||(t[0]==='cust'&&tab==='store');return'<button class="'+(on?'on':'')+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('');var o=$('nav').querySelector('.on');if(o&&o.scrollIntoView)o.scrollIntoView({inline:'center',block:'nearest'})}
function go(t,c){if(t==='det'&&tab!=='det')BK=tab;tab=t;if(c!==undefined)cur=c;if(t==='visit'&&c===undefined&&tab==='visit'){}P=[];draw()}
function draw(){nav();var pff=$('pff');if(pff)pff.style.display=tab==='pf'?'block':'none';document.body.classList.toggle('pfm',tab==='pf');$('hs').textContent=E?'کارشناس: '+E:'ثبت ویزیت و اطلاعات فروشگاه‌ها';({cust:vCust,plan:vPlan,visit:vVisit,rep:vRep,det:vDet,store:vStore,imp:vImp,hist:vHist,chq:vChq,perf:vPerf,pf:vPf})[tab]()}
function allC(){var a=D?Object.keys(D.cust).map(function(k){return D.cust[k]}):[];S.forEach(function(s){a.push({code:s.code,name:s.name,city:s.city,mobile:s.mobile,isNew:1})});return a}
function vCust(){
 $('app').innerHTML='<h2>فروشگاه‌ها'+(E?' - '+esc(E):'')+'</h2><input id="q" placeholder="جستجو با نام یا کد مشتری" oninput="fl()"><div class="row" style="margin-bottom:10px"><button class="b" onclick="go(\'store\')">+ فروشگاه جدید</button></div><div id="ls"></div>';fl()}
function fl(){var q=nm($('q').value),h='';allC().filter(function(c){return!q||nm(c.name).indexOf(q)>-1||String(c.code).indexOf(q)>-1}).forEach(function(c){h+='<div class="c" onclick="go(\'det\',\''+esc(c.code)+'\')"><b>'+esc(c.name)+'</b>'+(c.isNew?' <span class="tag">جدید</span>':'')+'<div class="mu">کد '+esc(c.code)+' | '+esc(c.city||'')+(c.grade?' | گرید '+esc(c.grade):'')+'</div></div>'});$('ls').innerHTML=h||'<p class="mu">موردی پیدا نشد</p>'}
function N(x){return Number(x)||0}
function sm(a){return(a||[]).reduce(function(t,x){return t+N(x)},0)}
function pc(a,b){return b?Math.round(a/b*100):0}
function bar(p){return'<div style="height:8px;background:var(--bd);border-radius:99px;margin:6px 0"><div style="width:'+Math.max(0,Math.min(100,p))+'%;height:8px;border-radius:99px;background:var(--ac)"></div></div>'}
function tg(t){return'<span class="tag">'+t+'</span>'}
function vDet(){
 var c=D&&D.cust[cur];
 if(!c){var s=S.filter(function(x){return x.code==cur})[0]||{};$('app').innerHTML='<div class="c"><h2>'+esc(s.name)+'</h2><p>موبایل: '+esc(s.mobile)+'<br>شهر: '+esc(s.city)+'<br>آدرس: '+esc(s.addr)+'</p><button class="b p" onclick="go(\'visit\',\''+esc(cur)+'\')">ثبت ویزیت</button> <button class="b" onclick="go(BK||\'cust\')">بازگشت</button></div>';return}
 var ct=c.cat||{},pl=ct.plan||[],sl=ct.sale||[],by=ct.buy||[],sk=c.stock||[],rem=[],opp=[],low=[];
 CATS.forEach(function(n,i){var r=N(pl[i])-N(sl[i]);if(r>0)rem.push([n,r]);if(!N(by[i])&&N(pl[i])>0)opp.push(n);if(sk[i]!==''&&sk[i]!=null&&N(by[i])>0&&N(sk[i])<N(by[i])/3)low.push(n+' ('+fa(N(sk[i]))+' موجودی)')});
 rem.sort(function(x,y){return y[1]-x[1]});
 var tp={},last='';c.orders.forEach(function(o){tp[o[1]]=(tp[o[1]]||0)+N(o[2]);if(String(o[0])>last)last=String(o[0])});
 var top=Object.keys(tp).sort(function(x,y){return tp[y]-tp[x]}).slice(0,5);
 var pend=c.aban.filter(function(o){return String(o[4]).indexOf('کاملا بارگیری')<0});
 var cq=(D.chq||[]).filter(function(x){return x[0]===c.code}),remR=Math.max(0,N(c.plan)-N(c.buy)),pcn=pc(N(c.buy),N(c.plan));
 var t='<div class="w"><table><tr><th></th>'+CATS.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>';
 [['buy','خرید ۳ماهه'],['inst','نصب ۳ماهه'],['plan','پلن آبان'],['sale','فروش آبان']].forEach(function(k){t+='<tr><th>'+k[1]+'</th>'+CATS.map(function(n,i){return'<td>'+fa((ct[k[0]]||[])[i])+'</td>'}).join('')+'</tr>'});
 t+='<tr><th>موجودی مشتری</th>'+CATS.map(function(n,i){return'<td>'+(sk[i]===''||sk[i]==null?'-':fa(sk[i]))+'</td>'}).join('')+'</tr></table></div>';
 var h='<div class="c"><button class="b" onclick="go(BK||\'cust\')">بازگشت</button><h2>'+esc(c.name)+'</h2>'+tg('کد '+esc(c.code))+tg(esc(c.city))+tg('گرید '+esc(c.grade))+tg(esc(c.type||c.kind||''))+(c.mobile?'<p>مالک: '+esc(c.owner)+' | <a href="tel:'+esc(c.mobile)+'">'+esc(c.mobile)+'</a></p>':'')+'<button class="b p" onclick="go(\'visit\',\''+esc(c.code)+'\')">ثبت ویزیت</button> <button class="b" onclick="exC()">اکسل سوابق</button></div>'
 +'<div class="c" style="border-color:var(--ac)"><h3 style="margin-top:0">پیشنهاد فروش</h3><div class="li">مانده پلن ریالی: <b>'+mi(remR)+'</b> م از '+mi(c.plan)+' م (تحقق '+fa(pcn)+'٪)'+bar(pcn)+'</div>'
 +(rem.length?'<div class="li"><b>مانده تا پلن (تعدادی):</b><br>'+rem.map(function(r){return tg(r[0]+': '+fa(r[1])+' دستگاه')}).join('')+'</div>':'')
 +(opp.length?'<div class="li"><b>در پلن هست ولی ۳ ماه خرید نکرده:</b><br>'+opp.map(tg).join('')+'</div>':'')
 +(low.length?'<div class="li"><b>موجودی کمتر از مصرف ماهانه:</b><br>'+low.map(tg).join('')+'</div>':'')
 +(top.length?'<div class="li"><b>بیشترین خرید این مشتری:</b><br>'+top.map(function(n){return tg(esc(n)+' ('+fa(tp[n])+')')}).join('')+'</div>':'')
 +(last?'<div class="li">آخرین خرید ثبت‌شده: '+esc(last)+'</div>':'')

:root[data-theme="dark"]{--bg:#0e1320;--card:#182033;--tx:#e8edf7;--mu:#93a0b8;--bd:#27314a;--ac:#5b92ff;--ac2:#16295a;--acx:#0a1020;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:96px}
.hero{background:linear-gradient(135deg,#0f2a5c,#1e5bd8);color:#fff;padding:22px 16px 40px;display:flex;gap:12px;align-items:center;border-radius:0 0 26px 26px}
.wm{display:inline-block;background:#fff;color:#1e5bd8;font:800 15px/1 Arial,Helvetica,sans-serif;letter-spacing:2px;padding:7px 11px;border-radius:5px;direction:ltr}.pg .wm{color:#d71920}
.hero h1{margin:0;font-size:20px;font-weight:800}.hero div div{opacity:.8;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:12px;padding:14px;box-shadow:var(--sh)}
.card.up{margin-top:-24px}
.st{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}.st i{font-style:normal;background:var(--ac);color:var(--acx);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;outline:0}input:focus{border-color:var(--ac)}
details{margin-top:10px}summary{color:var(--ac);font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:3px 14px;font:inherit;white-space:nowrap}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.it{display:flex;gap:10px;align-items:center;padding:10px;margin:8px 0;border:1.5px solid var(--bd);border-inline-start:5px solid var(--bc,#999);border-radius:12px;background:var(--bg)}
.it.on{border-color:var(--ac);border-inline-start-color:var(--bc,#999);background:var(--card);box-shadow:var(--sh)}
.it .n{flex:1;min-width:0}.it .t{font-size:14px;font-weight:600;line-height:1.5}.it .p{font-weight:800;color:var(--ac);font-size:14px}
.tag{display:inline-block;font-size:11px;color:var(--mu);margin-inline-end:6px}
.q{display:flex;align-items:center;gap:4px}.q button{width:36px;height:36px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:20px;line-height:1}.q button.m{background:var(--bd);color:var(--tx)}
.q input{width:44px;text-align:center;padding:6px 0;font-weight:700}
#bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;box-shadow:0 -4px 16px rgba(15,42,92,.1)}
#bar b{font-size:16px;display:block}.btn{background:linear-gradient(135deg,#1e5bd8,#0f2a5c);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700}.btn.s{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}.btn:disabled{opacity:.6}
.mu{color:var(--mu);font-size:12px}
#pv{position:fixed;inset:0;background:#cfd6e4;overflow:auto;display:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#pv .act{display:flex;gap:8px;padding:10px 12px;position:sticky;top:0;background:#cfd6e4;z-index:2}
#sc{overflow:hidden;margin:0 6px}#inv{transform-origin:top right}
.pg{width:794px;height:1123px;background:#fff;color:#2a1114;position:relative;overflow:hidden;direction:rtl;font:13px/1.7 Vazirmatn,Tahoma,sans-serif;margin-bottom:16px}
.pg .tb{background:linear-gradient(135deg,#7f0d14,#d71920);color:#fff;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}
.pg .tb h2{margin:0;font-size:24px;font-weight:800}.pg .tb .s{font-size:12px;opacity:.85}.pg .tb .l{text-align:left;font-size:12px;line-height:1.9}.pg .tb .l b{font-size:20px;display:block}
.pg .bd{padding:18px 32px}

.pg .tl{width:300px;border:1px solid #e6cfd1;border-radius:8px;overflow:hidden}.pg .tl p{margin:0;display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px solid #f1e3e4}.pg .tl p.g{background:#7f0d14;color:#fff;font-weight:800;font-size:14px;border:0}
.pg .ft{position:absolute;bottom:0;left:0;right:0;padding:10px 32px;border-top:2px solid #d71920;font-size:10.5px;color:#7a6668;display:flex;justify-content:space-between}

 <div class="ft"><span>راس کل: میانگین موزون راس گروه‌ها بر اساس مبلغ نهایی هر گروه، به روز از تاریخ پیش‌فاکتور</span><span>صفحه ${fa(n+1)} از ${fa(n+1)}</span></div></div>`}
function pages(){const L=calc(),S=k=>L.reduce((a,x)=>a+x[k],0),G=S("g"),I=S("i"),V=S("v"),T=S("k"),no=LS.g("no","1001");
 const ch=[];for(let i=0;i<L.length;i+=14)ch.push(L.slice(i,i+14));if(ch[ch.length-1].length>8)ch.push([]);
 return ch.map((rows,pi)=>{const last=pi===ch.length-1;
 return `<div class="pg"><div class="tb"><div><span class="wm" style="margin-bottom:6px">DAEWOO</span><h2>${esc($("co").value)||"پیش‌فاکتور فروش"}</h2><div class="s">${esc($("ph").value)?"تلفن: "+esc($("ph").value):""}</div></div><div class="l"><b>پیش‌فاکتور</b>شماره: ${D(no)}<br>تاریخ: ${today()}</div></div>
 <div class="bd"><div class="info"><div><small>مشتری</small><b>${esc($("cu").value)||"—"}</b></div><div><small>کارشناس فروش</small><b>${esc($("ex").value)||"—"}</b></div></div>
 ${rows.length?`<table><tr><th>ردیف</th><th>شرح کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th><th>تخفیف</th><th>ارزش افزوده</th><th>مبلغ نهایی</th></tr>${rows.map((x,n)=>`<tr><td>${fa(pi*14+n+1)}</td><td class="l">${x.p[1]}</td><td>${fa(x.q)}</td><td>${fa(x.p[4])}</td><td>${fa(x.g)}</td><td>${fa(x.i)}</td><td>${fa(x.v)}</td><td><b>${fa(x.k)}</b></td></tr>`).join("")}</table>`:""}
 ${last?`<div class="tt"><div class="sg"><div>مهر و امضای فروشنده</div><div>تأیید مشتری</div></div><div class="tl"><p><span>جمع مبلغ</span><span>${fa(G)}</span></p><p><span>تخفیف</span><span>${fa(I)}</span></p><p><span>ارزش افزوده</span><span>${fa(V)}</span></p><p><span>گردکردن</span><span>${fa(T-(G-I+V))}</span></p><p class="g"><span>قابل پرداخت (ریال)</span><span>${fa(T)}</span></p><p><span>معادل تومان</span><span>${fa(T/10)}</span></p></div></div>`:""}</div>
 <div class="ft"><span>مبالغ به ریال؛ ارزش افزوده ۱۰٪؛ مبلغ هر ردیف به ۱۰٬۰۰۰ ریال گرد شده است. قیمت‌ها: ${D(PD)}</span><span>صفحه ${fa(pi+1)} از ${fa(ch.length+1)}</span></div></div>`}).join("")+sumPage(L,no,ch.length)}
function fit(){const s=Math.min(1,(innerWidth-12)/794),i=$("inv");i.style.transform=`scale(${s})`;$("sc").style.height=i.offsetHeight*s+"px"}
$("go").onclick=()=>{if(!calc().length){alert("ابتدا کالا انتخاب کنید");return}$("inv").innerHTML=pages();$("pv").style.display="block";fit()};
$("bk").onclick=()=>$("pv").style.display="none";
addEventListener("resize",()=>{if($("pv").style.display==="block")fit()});
let busy=false;
async function mk(){await document.fonts.ready;const h=document.createElement("div");h.style.cssText="position:fixed;left:-9999px;top:0";h.innerHTML=pages();document.body.appendChild(h);
 const pdf=new jspdf.jsPDF("p","mm","a4"),ps=[...h.querySelectorAll(".pg")];
 for(let i=0;i<ps.length;i++){ps[i].style.marginBottom="0";const cv=await html2canvas(ps[i],{scale:2,backgroundColor:"#fff"});if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297)}
 h.remove();const name="پیش‌فاکتور-"+($("cu").value.trim()||"مشتری")+".pdf",blob=pdf.output("blob");return{name,blob,f:new File([blob],name,{type:"application/pdf"})}}
async function run(b,fn){if(busy)return;busy=true;const t=b.textContent;b.disabled=true;b.textContent="در حال ساخت PDF…";
 try{await fn(await mk());LS.s("no",String(+LS.g("no","1001")+1))}catch(e){console.error(e);alert("ساخت PDF ناموفق بود. اینترنت را بررسی و دوباره تلاش کنید.")}
 b.disabled=false;b.textContent=t;busy=false}
async function save(r){const d=await claude.use("downloads");if(d)await d.save({filename:r.name,data:await r.blob.arrayBuffer()});else alert("ذخیره فایل در این نمایش ممکن نیست؛ لینک را در کروم باز کنید.")}
$("sh").onclick=()=>run($("sh"),async r=>{if(navigator.canShare&&navigator.canShare({files:[r.f]})){try{await navigator.share({files:[r.f],title:r.name});return}catch(e){if(e.name==="AbortError")return}}
 alert("ارسال مستقیم در این مرورگر ممکن نشد. فایل ذخیره می‌شود تا از بخش فایل‌ها برای مشتری بفرستید.");await save(r)});
$("sv").onclick=()=>run($("sv"),save);
let OFF=new Set(),MR=[];
const saveOff=()=>LS.s("pf_off",JSON.stringify([...OFF])),pruneOff=()=>{OFF=new Set([...OFF].filter(c=>P.some(p=>p[0]===c)));saveOff()};
function mcount(){const n=P.filter(p=>!OFF.has(p[0])).length,o=P.length-n;$("mc").textContent="فعال: "+fa(n)+" از "+fa(P.length)+" | نتایج فیلتر: "+fa(MR.length);$("oh").textContent=o?fa(o)+" کالا غیرفعال است (از «مدیریت کالاها» فعال می‌شوند)":""}
function fillSel(){const o=(a,t)=>`<option value="">${t}</option>`+[...new Set(a)].filter(Boolean).map(x=>`<option>${x}</option>`).join("");$("mb").innerHTML=o(P.map(p=>p[2]),"همه برندها");$("mf").innerHTML=o(P.map(p=>p[3]),"همه خانواده‌ها")}
function mlist(){const q=norm($("mq").value.trim()).split(/\s+/).filter(Boolean),b=$("mb").value,f=$("mf").value,st=$("ms").value;
 MR=P.filter(p=>(!b||p[2]===b)&&(!f||p[3]===f)&&(st==="all"||(st==="off")===OFF.has(p[0]))&&q.every(w=>norm(p[1]+" "+p[3]).includes(w)));
 $("ml").innerHTML=MR.slice(0,100).map(p=>`<label class="mr${OFF.has(p[0])?" off":""}"><input type="checkbox" data-c="${p[0]}"${OFF.has(p[0])?"":" checked"}><span>${p[1]}</span><small>${p[2]}</small></label>`).join("")||'<div class="mu">موردی پیدا نشد</div>';
 if(MR.length>100)$("ml").insertAdjacentHTML("beforeend",'<div class="mu">فقط ۱۰۰ مورد اول نمایش داده شد؛ فیلتر یا جستجو کنید.</div>');mcount()}
$("mq").oninput=$("mb").onchange=$("mf").onchange=$("ms").onchange=mlist;
$("ml").onchange=e=>{if(!e.target.matches("input"))return;const c=e.target.dataset.c;if(e.target.checked)OFF.delete(c);else{OFF.add(c);delete Q[c]}saveOff();e.target.closest("label").classList.toggle("off",!e.target.checked);mcount();list();sum()};
$("md").onclick=()=>{MR.forEach(p=>{OFF.add(p[0]);delete Q[p[0]]});saveOff();mlist();list();sum()};
$("ma").onclick=()=>{MR.forEach(p=>OFF.delete(p[0]));saveOff();mlist();list();sum()};
const latin=s=>s.replace(/[۰-۹]/g,d=>F.indexOf(d));
function applyData(){$("pd").textContent=D(PD);$("cl").innerHTML=C.map(c=>`<option value="${c[1]}">`).join("");
 $("ch").innerHTML=["همه",...new Set(P.map(p=>p[2]))].map(b=>`<button class="chip${b==="همه"?" on":""}" data-b="${b}">${b}</button>`).join("");brand="همه";
 $("di").textContent=fa(P.length)+" کالا · "+fa(C.length)+" مشتری · تاریخ "+D(PD);fillSel();mlist();list();sum()}
async function importXlsx(file){const out=$("im");out.textContent="در حال خواندن فایل…";
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),n2=s=>String(s==null?"":s).replace(/[يى]/g,"ی").replace(/ك/g,"ک").trim();let np=[],nc=[],nd=null;
  for(const name of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
   const hi=rows.findIndex(r=>r.some(c=>n2(c)==="کد کالا")&&r.some(c=>n2(c).includes("قیمت واحد")));
   if(hi>=0&&!np.length){const h=rows[hi].map(n2),ix=k=>h.findIndex(x=>x.includes(k)),a=ix("کد کالا"),b=h.findIndex(x=>x==="کالا"),c=ix("برند"),d=ix("خانواده"),f=ix("قیمت واحد");
    rows.slice(hi+1).forEach(r=>{const pr=Number(r[f]);if(r[a]&&r[b]&&r[c]&&pr>0)np.push([String(r[a]),n2(r[b]),n2(r[c]),d>=0?n2(r[d]):"",Math.round(pr)])});
    for(const r of rows.slice(0,hi)){const j=r.findIndex(x=>n2(x).includes("تاریخ"));if(j>=0){const v=r.slice(j+1).find(x=>x!=null&&x!==""&&x!==0);if(v!=null&&/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}$/.test(latin(String(v).trim())))nd=latin(String(v).trim())}}}
   else if(hi<0&&rows[0]&&n2(rows[0][0])==="کد مشتری"&&n2(rows[0][1])==="مشتری"&&!nc.length)rows.slice(1).forEach(r=>{if(r[0]&&r[1])nc.push([String(r[0]),n2(r[1]).replace(/\s*\(.*?\)/g,"").trim()])})}
  if(!np.length)throw new Error("ستون‌های «کد کالا» و «قیمت واحد» پیدا نشد");
  P=np;if(nc.length)C=nc;PD=nd||latin(today());pruneOff();Object.keys(Q).forEach(k=>{if(!P.some(p=>p[0]===k))delete Q[k]});
  LS.s("pf_data",JSON.stringify({P,C,PD}));applyData();
  out.textContent="✓ "+fa(P.length)+" کالا"+(nc.length?" و "+fa(C.length)+" مشتری":" (لیست مشتری در فایل نبود؛ لیست قبلی حفظ شد)")+" بارگذاری شد. تاریخ لیست: "+D(PD)}
 catch(e){out.textContent="خطا: "+(e.message||e)}}
$("xf").onchange=e=>{const f=e.target.files[0];if(f)importXlsx(f);e.target.value=""};
$("rs").onclick=()=>{LS.s("pf_data","");P=B0.P;C=B0.C;PD=B0.PD;pruneOff();Object.keys(Q).forEach(k=>delete Q[k]);applyData();$("im").textContent="لیست اولیه بازگردانی شد."};
try{const s=JSON.parse(LS.g("pf_data","null"));if(s&&s.P&&s.P.length){P=s.P;if(s.C&&s.C.length)C=s.C;PD=s.PD||PD}}catch(e){}
try{OFF=new Set(JSON.parse(LS.g("pf_off","[]")))}catch(e){}
applyData();
<\/script>
